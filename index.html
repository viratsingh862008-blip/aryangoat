<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#171613" />
    <meta
      name="description"
      content="Hotel Kishan Bettiah — rooms, dining, amenities, gallery and contact."
    />
    <title>Hotel Kishan — Bettiah</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Mono&family=Manrope:wght@400;500;600;700&display=swap');
      :root {
        --ink: #171613;
        --paper: #f3efe6;
        --cream: #faf7f0;
        --stone: #dfd5c6;
        --muted: #737069;
        --bronze: #9b805c;
        --red: #8c2b2a;
        --line: #17161322;
        --night: #22221e;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          15px/1.6 Manrope,
          system-ui,
          sans-serif;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font: inherit;
      }
      .shell {
        width: min(1240px, calc(100% - 34px));
        margin: auto;
      }
      .mono,
      .eyebrow {
        font:
          10px 'DM Mono',
          monospace;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }
      .eyebrow {
        color: var(--bronze);
      }
      .serif {
        font:
          500 italic clamp(42px, 6vw, 80px)/0.9 'Cormorant Garamond',
          Georgia,
          serif;
      }
      .body {
        font-size: 16px;
        color: #56544d;
        max-width: 700px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 16px;
        border: 1px solid var(--ink);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .fill {
        background: var(--ink);
        color: #fff;
      }
      .top {
        height: 30px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
      }
      .top .shell {
        display: flex;
        justify-content: space-between;
      }
      .top span {
        font:
          8px 'DM Mono',
          monospace;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }
      .nav {
        position: sticky;
        top: 0;
        z-index: 40;
        background: #f3efe6e8;
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--line);
      }
      .navin {
        height: 74px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        gap: 11px;
        align-items: center;
      }
      .mark {
        width: 40px;
        height: 40px;
        border: 1px solid var(--ink);
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 800;
      }
      .brand b {
        display: block;
        font-size: 12px;
        letter-spacing: 0.12em;
      }
      .brand small {
        display: block;
        font:
          8px 'DM Mono',
          monospace;
        color: var(--muted);
      }
      .links {
        display: flex;
        gap: 20px;
        align-items: center;
      }
      .links a {
        font-size: 11px;
        color: #4c4a45;
      }
      .menu {
        display: none;
        background: none;
        border: 0;
        font-size: 24px;
      }
      .hero {
        position: relative;
        min-height: calc(100vh - 104px);
        color: #fff;
        display: grid;
        align-items: end;
        overflow: hidden;
      }
      .hero > img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: brightness(0.62) saturate(0.78);
      }
      .hero:after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, #00000008, #000000cd);
      }
      .heroIn {
        position: relative;
        z-index: 1;
        padding: 68px 0 34px;
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 30px;
        align-items: end;
      }
      .hero h1 {
        font:
          500 clamp(76px, 10vw, 142px)/0.78 'Cormorant Garamond',
          Georgia,
          serif;
        letter-spacing: -0.06em;
        margin: 15px 0 20px;
      }
